[package]
name = "real_estate_bot"
version = "0.1.0"
edition = "2026"
authors = ["-"]
license = "MIT"
description = "Telegram-бот для подбора недвижимости на Rust"
readme = "README.md"
repository = ""
keywords = ["telegram", "bot", "real-estate", "teloxide"]
categories = ["web-programming"]

################################################################################
# Зависимости проекта
################################################################################

[dependencies]

# Асинхронный рантайм
tokio = { version = "1.48", features = ["full"] }

# Telegram Bot API
teloxide = { version = "0.17", features = ["macros"] }

# Логирование
log = "0.4"
env_logger = "0.11"

# Работа с .env
dotenvy = "0.15"

# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Работа с датой и временем
chrono = { version = "0.4", features = ["serde"] }

# UUID для сущностей
uuid = { version = "1", features = ["v4", "serde"] }

# Асинхронная работа с PostgreSQL
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
    "migrate"
] }

# HTTP-клиент (для будущих интеграций)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls"
] }

# Веб-сервер для будущей админ-панели
axum = "0.8"

# Шаблонизатор HTML
askama = "0.14"

# Работа с multipart (загрузка фотографий)
tower-http = { version = "0.6", features = [
    "fs",
    "trace"
] }

# Глобические ленивые значения
once_cell = "1"

# Удобная обработка ошибок
anyhow = "1"
thiserror = "2"

# Асинхронные трейты
async-trait = "0.1"

################################################################################
# Dev зависимости
################################################################################

[dev-dependencies]
tokio-test = "0.4"

################################################################################
# Профили сборки
################################################################################

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

################################################################################
# Особенности проекта
################################################################################

[features]
default = []
admin = []

################################################################################
# Пояснения
#
# Проект будет использовать следующую структуру:
#
# src/
# ├── main.rs
# ├── config.rs
# ├── logger.rs
# ├── models.rs
# ├── bot/
# │   ├── mod.rs
# │   ├── handlers.rs
# │   └── keyboards.rs
# ├── db/
# │   ├── mod.rs
# │   └── operations.rs
# └── admin/
#     └── mod.rs
#
# Используется:
#
# • teloxide        — Telegram Bot API
# • sqlx            — PostgreSQL
# • tokio           — async runtime
# • dotenvy         — .env
# • env_logger      — логирование
# • askama          — HTML шаблоны
# • axum            — веб-админка
#
# Архитектура специально сделана модульной для дальнейшего расширения:
#
# ✓ уведомления
# ✓ интеграция с API недвижимости
# ✓ Redis
# ✓ кэширование
# ✓ статистика
# ✓ OAuth
# ✓ Telegram Login
# ✓ Docker
# ✓ Kubernetes
#
################################################################################